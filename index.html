function floorInfo(){
  const gs=S.tables.map(tableGeom),blocked=new Set(),extra={},parent={};
  const find=a=>parent[a]===undefined||parent[a]===a?a:(parent[a]=find(parent[a]));
  const inBox=(p,b,m=0)=>p.x>b[0]-m&&p.x<b[2]+m&&p.y>b[1]-m&&p.y<b[3]+m;
  for(let i=0;i<gs.length;i++)for(let j=0;j<gs.length;j++){if(i===j)continue;
    const A=gs[i],B=gs[j];
    A.seats.forEach(q=>{if(inBox(q,B.box,B.round?0:22))blocked.add(q.key);});
    if(i<j&&!A.round&&!B.round){const a=A.box,b=B.box;
      if(a[0]<=b[2]+2&&b[0]<=a[2]+2&&a[1]<=b[3]+2&&b[1]<=a[3]+2)parent[find(A.t.id)]=find(B.t.id);}

      if(blocked.has(p.key)||blocked.has(q.key))return;

      if(d<60)blocked.add(q.key);
      else if(d<=112){(extra[p.key]=extra[p.key]||[]).push(q.key);(extra[q.key]=extra[q.key]||[]).push(p.key);}
    }));
  return{gs,blocked,extra,group:id=>find(id)};
}
function allSeats(){
  const m={},F=S.settings.floor?floorInfo():null;
  S.tables.forEach(t=>seatsOf(t).forEach(s=>{
    if(F&&F.blocked.has(s.key))return;

    if(F)nb=[...nb,...(F.extra[s.key]||[])];

  }));
  if(CM)S.tables.forEach(t=>tableGeom(t).seats.forEach(q=>{if(m[q.key])m[q.key].y=q.y;}));
  for(const k in m){m[k].nb=m[k].nb.filter(x=>m[x]);m[k].across=m[k].across.filter(x=>m[x]);}

/* rule types: verb shown between the names */
const RTYPES={
  yes:{icon:ic('heart'),good:1,en:'next to',da:'ved siden af',lenS:'Sits next to',ldS:'Sidder ved siden af'},
  across:{icon:ic('arrow-up-down'),good:1,en:'across from',da:'overfor',lenS:'Sits across from',ldS:'Sidder overfor'},
  table:{icon:ic('circle-dot'),good:1,en:'same table as',da:'samme bord som',lenS:'Same table as',ldS:'Samme bord som'},
  no:{icon:ic('ban'),good:0,en:'not next to',da:'ikke ved siden af',lenS:'Not next to',ldS:'Ikke ved siden af'},
  soft:{icon:ic('circle-minus'),good:0,en:'preferably not next to',da:'helst ikke ved siden af',lenS:'Preferably not next to',ldS:'Helst ikke ved siden af'},
  nottable:{icon:ic('split'),good:0,en:'different table from',da:'andet bord end',lenS:'Different table from',ldS:'Andet bord end'}

const verb=t=>L(RTYPES[t].en,RTYPES[t].da);
function ruleText(r){return `${G(r.a)?.name} ${verb(r.type)} ${names([r.b,...(r.or||[])])}${r.kids&&r.type==='yes'?L(' (their kids may sit between)',' (deres børn må sidde imellem)'):''}`;}

/* social layer (guided setup): group = who knows whom, style = talk|easy|quiet.

function social(where,seats,TB,hit,assign){

  const tabT={};
  for(const g of S.guests){if(g.type!=='adult'||!where[g.id])continue;const t=TB[where[g.id].split(':')[0]];if(!t||t.kids)continue;
    (tabT[t.id]=tabT[t.id]||{t,n:0,talk:0}).n++;if(g.style==='talk')tabT[t.id].talk++;
    const nb=near(g);if(!nb.length||!g.group)continue;
    if(!nb.some(o=>knows(g,o)))hit(12,L(`Tip: ${g.name} doesn’t know anyone sitting nearby`,`Tip: ${g.name} kender ingen, der sidder tæt på`),[]);
    if(g.style==='quiet'&&nb.filter(o=>o.style==='talk'&&!knows(g,o)).length>=2)hit(8,L(`Tip: quiet ${g.name} sits between two talkative strangers`,`Tip: stille ${g.name} sidder mellem to snakkesalige fremmede`),[]);}
  const T=Object.values(tabT);if(T.length>1&&T.some(x=>x.talk>=2))T.filter(x=>!x.talk&&x.n>=3).forEach(x=>hit(6,L(`Tip: no one at ${x.t.name} to get the conversation going`,`Tip: ingen ved ${x.t.name} til at få snakken i gang`),[]));
  return 0;}
function evaluate(assign,seats,detail){
  const where={};for(const k in assign)if(assign[k]!=null)where[assign[k]]=k;
  const isNb=(a,b)=>{const sa=where[a],sb=where[b];return sa&&sb&&seats[sa].nb.includes(sb);};
  const sameT=(a,b)=>{const sa=where[a],sb=where[b];return sa&&sb&&sa.split(':')[0]===sb.split(':')[0];};
  let cost=0;const issues=[],bad=new Set(),TB={};S.tables.forEach(t=>TB[t.id]=t);const hasKT=S.tables.some(t=>t.kids);
  const hit=(w,msg,ids)=>{cost+=w;if(detail){issues.push(msg);ids.forEach(i=>where[i]&&bad.add(where[i]));}};
  if(detail){const need={},maxNb=Math.max(0,...Object.values(seats).map(x=>x.nb.length)),add=(a,b)=>{(need[a]=need[a]||new Set).add(b);(need[b]=need[b]||new Set).add(a);};
    S.rules.filter(r=>r.type==='yes'&&!r.kids&&!(r.or||[]).length).forEach(r=>add(r.a,r.b));
    S.guests.filter(g=>g.type==='kid'&&g.pmode==='next'&&(g.parents||[]).length===1).forEach(g=>add(g.id,g.parents[0]));
    for(const id in need){const g=G(id);if(g&&need[id].size>maxNb)issues.push(L(
      `Impossible: ${g.name} must sit next to ${need[id].size} people (${names([...need[id]])}) but a seat has at most ${maxNb} neighbours. Remove a “next to” rule, let a child sit “at the same table” as its parent, or count across the table as neighbours.`,
      `Umuligt: ${g.name} skal sidde ved siden af ${need[id].size} personer (${names([...need[id]])}), men en plads har højst ${maxNb} sidemænd. Fjern en “ved siden af”-regel, lad et barn sidde “ved samme bord” som forælderen, eller lad pladsen overfor tælle som sidemand.`));}
    S.guests.filter(g=>g.type==='kid'&&!(g.parents||[]).filter(G).length).forEach(g=>issues.push(L(`${g.name} (child) has no parent chosen`,`${g.name} (barn) har ingen forælder valgt`)));
  }
  const isAcross=(a,b)=>{const sa=where[a],sb=where[b];return sa&&sb&&(seats[sa].across||[]).includes(sb);};
  const viaKids=(a,b)=>{const sa=where[a],sb=where[b];if(!sa||!sb)return false;const seen=new Set([sa]),q=[sa];
    while(q.length){const k=q.shift();for(const n of seats[k].nb){if(n===sb)return true;if(seen.has(n))continue;seen.add(n);const o=G(assign[n]);
      if(o&&o.type==='kid'&&(o.parents||[]).some(p=>p==a||p==b))q.push(n);}}return false;};
  const RT={no:[(r,x)=>!isNb(r.a,x),100],yes:[(r,x)=>isNb(r.a,x)||(r.kids&&viaKids(r.a,x)),40],
    across:[(r,x)=>isAcross(r.a,x),40],table:[(r,x)=>sameT(r.a,x),30],soft:[(r,x)=>!isNb(r.a,x),15],nottable:[(r,x)=>!sameT(r.a,x),60]};
  RT.diff=RT.nottable;
  for(const r of S.rules){
    const a=G(r.a),t=RT[r.type];if(!a||!t)continue;
    const alts=[r.b,...(r.or||[])].filter(G);if(!alts.length)continue;
    if(!alts.some(x=>t[0](r,x))){const w=(r.type==='yes'||r.type==='across')&&alts.some(x=>sameT(r.a,x))?20:t[1];

    if(!where[g.id]){hit(1000,L(`${g.name} has no seat`,`${g.name} har ingen plads`),[]);continue;}
    const myT=TB[where[g.id].split(':')[0]],ktOK=g.type==='kid'&&g.pmode==='kids';
    if(myT&&myT.kids&&!ktOK)hit(g.type==='kid'?90:70,g.type==='kid'?L(`${g.name} is too small for the kids table`,`${g.name} er for lille til børnebordet`):L(`${g.name} (adult) is at the kids table`,`${g.name} (voksen) sidder ved børnebordet`),[g.id]);
    if(ktOK&&hasKT){if(!myT||!myT.kids)hit(80,L(`${g.name} is not at the kids table`,`${g.name} sidder ikke ved børnebordet`),[g.id]);continue;}
    if(g.type==='kid'&&g.parents&&g.parents.length){
      const ps=g.parents.filter(G);
      if(ps.length&&g.pmode!=='next'){
        if(!ps.some(p=>sameT(g.id,p)))hit(90,L(`${g.name} is not at the same table as ${names(ps)}`,`${g.name} sidder ikke ved samme bord som ${names(ps)}`),[g.id]);
      }else if(ps.length&&!ps.some(p=>isNb(g.id,p))){
        hit(ps.some(p=>sameT(g.id,p))?50:90,L(`${g.name} is not next to ${names(ps)}`,`${g.name} sidder ikke ved siden af ${names(ps)}`),[g.id]);
      }

  }
  if(!CM&&S.guests.some(g=>g.group||g.style))social(where,seats,TB,hit,assign);
  if(CM){const NB=id=>{const s=where[id];return s?seats[s].nb.map(k=>G(assign[k])).filter(Boolean):[];};
    const ys=Object.values(seats).map(s=>s.y).filter(y=>y!=null),y0=Math.min(...ys),y1=Math.max(...ys),cut=y0+Math.max(60,(y1-y0)*.34);
    const seen=new Set(),past=new Set(S.settings.fresh!==false?(S.history||[]).slice(-4).flatMap(h=>h.pairs):[]);
    for(const g of S.guests){if(!where[g.id])continue;
      if(g.front&&seats[where[g.id]].y>cut)hit(40,L(`${g.name} should sit near the board`,`${g.name} skal sidde tæt på tavlen`),[g.id]);
      for(const o of NB(g.id)){const k=Math.min(g.id,o.id)+'-'+Math.max(g.id,o.id);if(seen.has(k))continue;seen.add(k);

function arrange(){
  const seats=allSeats(),keys=Object.keys(seats);
  for(const k in S.locked)if(!seats[k]||!G(S.locked[k]))delete S.locked[k];
  const lockedG=new Set(Object.values(S.locked).map(Number));
  const free=keys.filter(k=>!(k in S.locked));
  const people=S.guests.filter(g=>!lockedG.has(g.id)).map(g=>g.id);
  if(people.length>free.length)return{error:L(`Not enough seats: ${S.guests.length} guests but only ${keys.length} seats. Add a table or more seats.`,`Ikke nok pladser: ${S.guests.length} gæster men kun ${keys.length} pladser. Tilføj et bord eller flere pladser.`)};

function migrate(){

    if(t.endL===undefined){t.endL=(t.ends==='one'||t.ends==='both'||t.ends===undefined)?1:0;t.endR=(t.ends==='both'||t.ends===undefined)?1:0;
      for(const m of[S.assign,S.locked]){if((t.id+':L')in m){m[t.id+':L0']=m[t.id+':L'];delete m[t.id+':L'];}if((t.id+':E')in m){m[t.id+':E0']=m[t.id+':E'];delete m[t.id+':E'];}}}

<script>

/* ---------- header / nav ---------- */

/* ---------- TABLES ---------- */
function setT(id,f,v){const t=S.tables.find(t=>t.id==id);if(!t)return;

function addTable(shape){const y=S.tables.length?Math.max(...S.tables.map(t=>tableGeom(t).box[3]))+(CM?103:180):0;

  S.tables.push({id:nid(),name:L('Table ','Bord ')+(S.tables.length+1),shape:shape||'rect',side:shape==='round'?8:4,endL:shape==='round'?0:1,endR:shape==='round'?0:1,x:0,y,rot:0});commit();
  setTimeout(()=>{const c=[...document.querySelectorAll('.tcard')].pop();c&&c.scrollIntoView({behavior:'smooth',block:'center'});},50);}
function delTable(id){const t=S.tables.find(t=>t.id==id);if(!confirm(L(`Delete ${t.name}?`,`Slet ${t.name}?`)))return;S.tables=S.tables.filter(t=>t.id!=id);commit();}
function dupTable(id){const t=S.tables.find(t=>t.id==id);const y=Math.max(...S.tables.map(t=>tableGeom(t).box[3]))+180;S.tables.push({...t,id:nid(),name:L('Table ','Bord ')+(S.tables.length+1),x:0,y});commit();}
function capOf(t){return seatsOf(t).length;}

function vPattern(){
  const rect=S.tables.filter(t=>t.shape==='rect');patIds=patIds.filter(id=>rect.some(t=>t.id==id));
  const need={line:1,L:2,T:2,U:3,E:3}[pat];
  return `<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px"><b>${L('Quick shapes','Hurtige former')}</b><p class="muted" style="margin:4px 0 8px">${L('Pick a shape, then tap the long tables in order. The first one is the main table.','Vælg en form, og tryk så på langbordene i rækkefølge. Det første er hovedbordet.')}</p>
   <div class="chips" style="margin-bottom:10px">${[['line','━ '+L('Line','Linje')],['L','┗ L'],['T','┳ T'],['U','⊐ U'],['E','E '+L('comb','kam')]].map(([v,t])=>`<button class="chip" aria-pressed="${pat===v}" onclick="pat='${v}';render()">${t}</button>`).join('')}</div>
   <div class="chips" style="margin-bottom:10px">${rect.map(t=>{const i=patIds.indexOf(t.id);return `<button class="chip" aria-pressed="${i>=0}" onclick="togPat(${t.id})">${i>=0?`<span class="o">${i+1}</span>`:''}${esc(t.name)}</button>`;}).join('')||`<span class="muted">${L('Add long tables first.','Tilføj langborde først.')}</span>`}</div>
   <button class="btn" ${patIds.length<need?'disabled':''} onclick="applyPattern()">${L('Arrange tables','Stil bordene op')}</button> <span class="muted">${patIds.length<need?L(`Choose at least ${need}`,`Vælg mindst ${need}`):''}</span>
   <p class="muted">${L('You can also drag tables around under Seating, Move tables.','Du kan også trække bordene rundt under Bordplan, Flyt borde.')}</p></div>`;
}
function togPat(id){const i=patIds.indexOf(id);i>=0?patIds.splice(i,1):patIds.push(id);render();}
function applyPattern(){
  const ts=patIds.map(id=>S.tables.find(t=>t.id==id)).filter(t=>t&&t.shape==='rect');const len=t=>LEN(t)*U;
  if(pat==='line'){let x=0;ts.forEach(t=>{t.rot=0;t.x=x;t.y=0;x+=len(t);});}
  else if(pat==='L'){const[a,b]=ts;a.rot=1;a.x=0;a.y=0;b.rot=0;b.x=D;b.y=len(a)-D;ts.slice(2).forEach(t=>{t.rot=0;t.x=D+len(b);t.y=len(a)-D;});}
  else if(pat==='T'){const[a,...r]=ts;a.rot=0;a.x=0;a.y=0;let y=D;r.forEach(t=>{t.rot=1;t.x=(len(a)-D)/2;t.y=y;y+=len(t);});}
  else{const[a,...arms]=ts;a.rot=1;a.x=0;a.y=0;const Lg=len(a);arms.forEach((t,i)=>{t.rot=0;t.x=D;t.y=arms.length===1?0:Math.round(i*(Lg-D)/(arms.length-1));});}
  const maxY=Math.max(...ts.map(t=>(t.y||0)+(t.rot?len(t):D)))+140;let x=0;
  S.tables.filter(t=>!ts.includes(t)).forEach(t=>{const g=tableGeom(t);t.x=x;t.y=maxY;x+=(g.box[2]-g.box[0])+200;});
  S.settings.floor=true;commit();toast(L('Tables arranged – see Seating','Bordene er stillet op – se Bordplan'));}

  if(!CM&&newType==='kid')guestSheet(g.id);}
let newLevel='mid';const lvSeg=(cur,fn)=>seg(Object.keys(LV).map(k=>[k,`<span class="lvd" style="background:${LV[k].c}"></span>`+lvName(k)]),cur,fn,L('Academic level','Fagligt niveau'));
function bulkAdd(){const b=$('#bulk');let n=0;b.value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(l=>{const kid=/\*$/.test(l);if(CM){const lv=/\+$/.test(l)?'strong':/-$/.test(l)?'support':'mid';S.guests.push({id:nid(),name:l.replace(/[+\-*]$/,'').trim(),type:'adult',level:lv,parents:[],pmode:'next'});}else S.guests.push({id:nid(),name:l.replace(/\*$/,'').trim(),type:kid?'kid':'adult',parents:[],pmode:'next'});n++;});b.value='';commit();toast(L(`${n} guests added`,`${n} gæster tilføjet`));}
function delGuest(id){S.guests=S.guests.filter(g=>g.id!=id);S.rules=S.rules.filter(r=>r.a!=id&&r.b!=id).map(r=>({...r,or:(r.or||[]).filter(x=>x!=id)}));S.guests.forEach(g=>g.parents=(g.parents||[]).filter(p=>p!=id));
  for(const k in S.assign)if(S.assign[k]==id)S.assign[k]=null;for(const k in S.locked)if(S.locked[k]==id)delete S.locked[k];save();}

`}
   ${!CM&&GS.type==='adult'?`<label class="lbl" for="gsG">${L('Group (people who know each other)','Gruppe (folk der kender hinanden)')}</label><input id="gsG" class="field" list="gsGl" value="${esc(GS.group)}" oninput="GS.group=this.value" placeholder="${L('e.g. Family, Work','fx Familie, Arbejde')}"><datalist id="gsGl">${gdGroups().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
   <div class="lbl">${L('At a party','Til fest')}</div>${seg(gdStyles(),GS.style,"(v=>{GS.name=$('#gsN').value;GS.group=$('#gsG').value;GS.style=v;drawGS()})")}`:''}
   <div class="lbl">${L('Rules','Regler')}</div><ul class="list">${S.rules.filter(r=>r.a==GS.id||r.b==GS.id||(r.or||[]).includes(GS.id)).map(r=>`<li><button class="rule" onclick="ruleSheet(${r.id})"><span class="ri">${RTYPES[r.type].icon}</span><span class="grow">${esc(ruleText(r))}</span></button></li>`).join('')}</ul>
   <button class="btn ghost" onclick="ruleSheet(null,${GS.id})">${ic('plus')} ${L('Add rule for','Tilføj regel for')} ${esc(g.name)}</button>
  </div><div class="sf"><button class="btn danger" onclick="if(confirm('${L('Delete this guest?','Slet denne gæst?')}')){delGuest(${GS.id});closeDlg();render()}">${L('Delete','Slet')}</button><button class="btn primary" onclick="saveGS()">${L('Done','Færdig')}</button></div>`;}
function saveGS(){const g=G(GS.id);g.name=($('#gsN').value.trim()||g.name);g.type=GS.type;if(CM){g.level=GS.level;g.front=GS.front||undefined;}if(!CM&&GS.type==='adult'){g.group=($('#gsG')?.value||'').trim();g.style=GS.style==='easy'?undefined:GS.style;}
  if(GS.type==='kid'){g.parents=GS.parents;g.pmode=GS.pmode;}else{g.parents=[];S.guests.forEach(k=>{if(k.type!=='kid'||k.id===g.id)return;const has=k.parents.includes(g.id),want=GS.kids.includes(k.id);if(want&&!has)k.parents.push(g.id);if(!want&&has)k.parents=k.parents.filter(p=>p!=g.id);});}
  closeDlg();commit();}

/* ---------- RULES ---------- */
let RS=null;
function ruleSheet(id,who){const r=id!=null&&S.rules.find(x=>x.id===id);RS=r?{id:r.id,a:r.a,type:r.type==='diff'?'nottable':r.type,b:[r.b,...(r.or||[])].filter(G),kids:!!r.kids}:{id:null,a:who||null,type:'yes',b:[],kids:false};drawRS();openDlg();}
function drawRS(){const order=['yes','across','table','soft','no','nottable'];
  const chip=(g,on,fn)=>`<button class="chip ${g.type==='kid'?'kid':''}" aria-pressed="${on}" onclick="${fn}">${esc(g.name)}</button>`;
  const ok=RS.a&&RS.b.length;
  $('#dlg').innerHTML=`<div class="sh"><h3 id="dlgT">${RS.id?L('Edit rule','Redigér regel'):L('New rule','Ny regel')}</h3><button class="icon" aria-label="${L('Close','Luk')}" onclick="closeDlg()">${ic('x')}</button></div><div class="sb">
   <div class="lbl">1 · ${L('Who?','Hvem?')}</div><div class="chips">${S.guests.map(g=>chip(g,RS.a===g.id,`RS.a=${g.id};RS.b=RS.b.filter(x=>x!=${g.id});drawRS()`)).join('')}</div>
   <div class="lbl">2 · ${L('Should…','Skal…')}</div><div class="types">${order.map(t=>`<button class="type" aria-pressed="${RS.type===t}" onclick="RS.type='${t}';drawRS()"><span class="ri" aria-hidden="true">${RTYPES[t].icon}</span><b>${L(RTYPES[t].lenS,RTYPES[t].ldS)}</b></button>`).join('')}</div>
   <div class="lbl">3 · ${L('Whom?','Hvem?')}</div><p class="muted" style="margin-top:-4px">${L('Pick more than one to mean “either of them”.','Vælg flere for at sige “en af dem”.')}</p>
   <div class="chips">${S.guests.filter(g=>g.id!==RS.a).map(g=>chip(g,RS.b.includes(g.id),`RS.b=RS.b.includes(${g.id})?RS.b.filter(x=>x!=${g.id}):[...RS.b,${g.id}];drawRS()`)).join('')}</div>
   ${RS.type==='yes'?`<div class="kv" style="margin-top:12px"><span class="grow">${L('Their own children may sit between them','Deres egne børn må sidde imellem')}</span>${sw(RS.kids,'(v=>{RS.kids=v;drawRS()})',L('Children between OK','Børn imellem OK'))}</div>`:''}
   <div class="lbl">${L('Preview','Forhåndsvisning')}</div><div class="preview" aria-live="polite">${ok?esc(ruleText({a:RS.a,b:RS.b[0],or:RS.b.slice(1),type:RS.type,kids:RS.kids})):`<span class="muted">${L('Choose two people','Vælg to personer')}</span>`}</div>
  </div><div class="sf">${RS.id?`<button class="btn danger" onclick="S.rules=S.rules.filter(r=>r.id!==${RS.id});closeDlg();commit()">${L('Delete','Slet')}</button>`:`<button class="btn" onclick="closeDlg()">${L('Cancel','Annullér')}</button>`}<button class="btn primary" ${ok?'':'disabled'} onclick="saveRS()">${L('Save','Gem')}</button></div>`;}
function saveRS(){const r={id:RS.id??nid(),a:RS.a,b:RS.b[0],type:RS.type};if(RS.b.length>1)r.or=RS.b.slice(1);if(RS.kids&&RS.type==='yes')r.kids=true;
  const i=S.rules.findIndex(x=>x.id===r.id);i>=0?S.rules[i]=r:S.rules.push(r);closeDlg();commit();}
function vRules(){
  const good=S.rules.filter(r=>G(r.a)&&G(r.b)),grp=[[1,L('Together','Sammen')],[0,L('Apart','Adskilt')]];
  return `<div class="narrow"><h1>${L('Rules','Regler')}</h1><p class="lead">${L('Who should – or shouldn’t – sit together. Optional: skip this if you don’t need it.','Hvem der skal – eller ikke skal – sidde sammen. Valgfrit: spring over hvis du ikke har brug for det.')}</p>
  <button class="btn primary big wide" style="margin-bottom:12px" ${S.guests.length<2?'disabled':''} onclick="ruleSheet()">${ic('plus')} ${L('New rule','Ny regel')}</button>
  ${S.guests.length<2?`<p class="muted">${L('Add at least two guests first.','Tilføj mindst to gæster først.')}</p>`:''}
  ${good.length?grp.map(([gd,h])=>{const rs=good.filter(r=>RTYPES[r.type].good===gd);return rs.length?`<h2>${h}</h2><div class="card"><ul class="list">${rs.map(r=>`<li><button class="rule" onclick="ruleSheet(${r.id})" aria-label="${L('Edit rule','Redigér regel')}: ${esc(ruleText(r))}"><span class="ri ${gd?'ok':'bad'}" aria-hidden="true">${RTYPES[r.type].icon}</span><span class="grow">${esc(ruleText(r))}</span></button><button class="del" aria-label="${L('Delete rule','Slet regel')}: ${esc(ruleText(r))}" onclick="S.rules=S.rules.filter(x=>x.id!==${r.id});commit()">${ic('x')}</button></li>`).join('')}</ul></div>`:'';}).join('')
   :`<div class="card empty">${L('No rules yet.','Ingen regler endnu.')}</div>`}
  ${S.guests.some(g=>g.type==='kid')?`<p class="muted">${L('Children follow their parents automatically – set that up under Guests.','Børn følger automatisk deres forældre – det indstilles under Gæster.')}</p>`:''}
  <button class="btn primary big wide" onclick="go('plan')">${L('Next: Seating','Næste: Bordplan')}</button></div>`;
}
</script>
<script>
/* ---------- GUIDED SETUP (event mode) ----------
   S.guide = {step:'names'|'kids'|'conflicts'|'done', i:index of guest card}
   Creates normal guests / parents / rules; afterwards the user lands in the regular screens. */
function gdState(){if(!S.guide)S.guide={step:'names',i:0};return S.guide;}
function gdGo(step,i){const g=gdState();g.step=step;g.i=i||0;save();render();scrollTo(0,0);}
function gdAdvanced(){gdState().step='done';save();go(S.guests.length?'guests':'tables');}
function gdRestart(){if($('#dlg').open)closeDlg();gdState();S.guide.step='names';S.guide.i=0;save();go('guide');}
function gdSteps(cur){const st=[['names',L('Names','Navne')],['kids',L('Children','Børn')],['groups',L('Who knows whom','Hvem kender hvem')],['style',L('Party style','Festtype')],['conflicts',L('Who to keep apart','Hvem skal holdes adskilt')],['sum',L('Summary','Oversigt')]];
  const ci=st.findIndex(s=>s[0]===cur);
  return `<ol class="gdsteps" aria-label="${L('Guide steps','Guidens trin')}">${st.map((s,i)=>`<li class="${i<ci?'done':i===ci?'cur':''}" ${i===ci?'aria-current="step"':''}><span>${i<ci?ic('check'):i+1}</span>${s[1]}</li>`).join('')}</ol>`;}
function gdHead(cur,title,lead){return `<div class="gdtop">${gdSteps(cur)}<button class="btn ghost gdadv" onclick="gdAdvanced()">${ic('settings-2')} ${L('Advanced','Avanceret')}</button></div><h1>${title}</h1><p class="lead">${lead}</p>`;}
/* step 1: names */
function gdAdd(){const t=$('#gdIn'),lines=t.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return t.focus();
  const mk=l=>{const kid=/\*$/.test(l),n=l.replace(/\*$/,'').trim();if(!n)return null;const g={id:nid(),name:n,type:kid?'kid':'adult',parents:[],pmode:'next'};S.guests.push(g);return g;};
  for(const l of lines){const parts=l.split(/\s*(?:&|\+|\bog\b|\band\b)\s*/i).filter(Boolean);const gs=parts.map(mk).filter(Boolean);
    if(gs.length===2&&gs.every(g=>g.type==='adult'))S.rules.push({id:nid(),a:gs[0].id,b:gs[1].id,type:'yes',kids:true,couple:true});}
  t.value='';commit();$('#gdIn').focus();}
function gdToggleKid(id){const g=G(id);if(g.type==='kid'){g.type='adult';g.parents=[];}else{g.type='kid';g.pmode=g.pmode||'next';S.guests.forEach(k=>k.parents=(k.parents||[]).filter(p=>p!=id));}commit();}
function gdDel(id){S.guests=S.guests.filter(g=>g.id!=id);S.guests.forEach(k=>k.parents=(k.parents||[]).filter(p=>p!=id));S.rules=S.rules.filter(r=>r.a!=id&&r.b!=id);commit();}
function gdNames(){const gs=S.guests;
  return gdHead('names',L('Who is coming?','Hvem kommer?'),L('Write everyone’s name, one per line (or separated by commas). Write a couple with &, e.g. “Anna & Bo” – they are seated together. Put * after a child, e.g. “Emma*”. You can also tap a name below to switch between adult and child.','Skriv alle navne, ét pr. linje (eller adskilt med komma). Skriv et par med &, fx “Anna & Bo” – de bliver sat sammen. Skriv * efter et barn, fx “Emma*”. Du kan også trykke på et navn herunder for at skifte mellem voksen og barn.'))+
  `<div class="card"><label class="lbl" for="gdIn">${L('Names','Navne')}</label><textarea class="field" id="gdIn" rows="5" placeholder="Anna &amp; Bo&#10;Carl&#10;Emma*" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))gdAdd()"></textarea>
   <div class="row" style="margin-top:10px"><button class="btn primary" onclick="gdAdd()">${ic('plus')} ${L('Add','Tilføj')}</button></div></div>
  ${gs.length?`<div class="card"><div class="lbl">${gs.length} ${L('guests','gæster')} · ${gs.filter(g=>g.type==='kid').length} ${L('children','børn')}</div><div class="chips">${gs.map(g=>`<span class="gdname"><button class="chip ${g.type==='kid'?'kid':''}" aria-pressed="false" onclick="gdToggleKid(${g.id})" title="${L('Switch adult/child','Skift voksen/barn')}">${ic(g.type==='kid'?'baby':'user')} ${esc(g.name)}${gdPartner(g.id)?' '+ic('heart'):''}</button><button class="icon sm" aria-label="${L('Remove','Fjern')} ${esc(g.name)}" onclick="gdDel(${g.id})">${ic('x')}</button></span>`).join('')}</div></div>`:''}
  <button class="btn primary big wide" ${gs.length?'':'disabled'} onclick="gdGo(S.guests.some(g=>g.type==='kid')?'kids':'groups')">${L('Next','Næste')}</button>`;}
/* step 2: kids -> parents */
function gdPar(k,p){const g=G(k);g.parents=g.parents||[];g.parents=g.parents.includes(p)?g.parents.filter(x=>x!=p):[...g.parents,p].slice(-2);commit();}
function gdKids(){const kids=S.guests.filter(g=>g.type==='kid'),ad=S.guests.filter(g=>g.type==='adult'),miss=kids.filter(k=>!(k.parents||[]).filter(G).length).length;
  return gdHead('kids',L('Who are the children’s parents?','Hvem er børnenes forældre?'),L('Tap one or two parents for each child. Children are seated next to a parent.','Tryk på en eller to forældre for hvert barn. Børn bliver sat ved siden af en forælder.'))+
  kids.map(k=>`<div class="card"><div class="lbl">${ic('baby')} <b>${esc(k.name)}</b></div><div class="chips">${ad.map(a=>`<button class="chip" aria-pressed="${(k.parents||[]).includes(a.id)}" onclick="gdPar(${k.id},${a.id})">${esc(a.name)}</button>`).join('')||`<span class="muted">${L('Add an adult first.','Tilføj først en voksen.')}</span>`}</div></div>`).join('')+
  (miss?`<p class="muted">${L(`${miss} child(ren) without a parent – you can also do this later.`,`${miss} barn/børn uden forælder – det kan også gøres senere.`)}</p>`:'')+
  `<div class="row"><button class="btn big grow" onclick="gdGo('names')">${L('Back','Tilbage')}</button><button class="btn primary big grow" onclick="gdGo('groups')">${L('Next','Næste')}</button></div>`;}

const gdPartner=id=>{const r=S.rules.find(r=>r.couple&&(r.a==id||r.b==id));return r?G(r.a==id?r.b:r.a):null;};
/* step 3: groups – who knows whom */
const gdGroups=()=>[...new Set([...(S.guide?.groups||[]),...S.guests.map(g=>g.group).filter(Boolean)])];
const gdStyles=()=>[['talk',ic('megaphone')+' '+L('Talkative','Snakkesalig')],['easy',ic('smile')+' '+L('Easy-going','Afslappet')],['quiet',ic('feather')+' '+L('Quiet','Stille')]];
function gdNewGroup(n){n=(n||'').trim();if(!n)return;const g=gdState();g.groups=gdGroups();if(!g.groups.includes(n))g.groups.push(n);g.cur=n;save();render();}
function gdSetGroup(id){const g=G(id),cur=gdState().cur;if(!cur)return;const v=g.group===cur?'':cur;g.group=v;const p=gdPartner(id);if(p&&(!p.group||p.group===cur))p.group=v;commit();}
function gdDelGroup(n){S.guide.groups=gdGroups().filter(x=>x!==n);S.guests.forEach(g=>{if(g.group===n)g.group='';});if(S.guide.cur===n)S.guide.cur=S.guide.groups[0];commit();}
function gdGroupsV(){const st=gdState(),gs=gdGroups(),cur=gs.includes(st.cur)?st.cur:gs[0],ad=S.guests.filter(g=>g.type==='adult'),none=ad.filter(g=>!g.group).length;st.cur=cur;
  const sug=[L('Family','Familie'),L('Friends','Venner'),L('Work','Arbejde'),L('Neighbours','Naboer'),L('Sports club','Sportsklub')].filter(x=>!gs.includes(x));
  return gdHead('groups',L('Who knows whom?','Hvem kender hvem?'),L('Make a group for each circle of people who know each other – family, work, friends. Then tap everyone in it. The plan makes sure nobody ends up next to only strangers.','Lav en gruppe for hver kreds af folk, der kender hinanden – familie, arbejde, venner. Tryk så på alle i den. Planen sørger for, at ingen ender med kun fremmede ved siden af sig.'))+
  `<div class="card"><div class="lbl">${L('Groups','Grupper')}</div><div class="chips">${gs.map(n=>`<span class="gdname"><button class="chip" aria-pressed="${n===cur}" onclick="gdState().cur=this.dataset.n;save();render()" data-n="${esc(n)}">${ic('users-round')} ${esc(n)} <small>${S.guests.filter(g=>g.group===n).length}</small></button><button class="icon sm" aria-label="${L('Remove group','Fjern gruppe')} ${esc(n)}" data-n="${esc(n)}" onclick="gdDelGroup(this.dataset.n)">${ic('x')}</button></span>`).join('')}
   ${sug.map(n=>`<button class="chip ghost" onclick="gdNewGroup(this.dataset.n)" data-n="${esc(n)}">${ic('plus')} ${esc(n)}</button>`).join('')}</div>
   <form class="row" style="margin-top:10px" onsubmit="event.preventDefault();gdNewGroup($('#gdG').value)"><label class="sr" for="gdG">${L('New group','Ny gruppe')}</label><input id="gdG" class="field grow" placeholder="${L('Other group…','Anden gruppe…')}"><button class="btn">${ic('plus')} ${L('Add','Tilføj')}</button></form></div>
  ${cur?`<div class="card"><div class="lbl">${L(`Tap everyone in “${esc(cur)}”`,`Tryk på alle i “${esc(cur)}”`)}</div><div class="chips">${ad.map(g=>`<button class="chip" aria-pressed="${g.group===cur}" onclick="gdSetGroup(${g.id})">${esc(g.name)}${g.group&&g.group!==cur?` <small class="muted">· ${esc(g.group)}</small>`:''}</button>`).join('')}</div>
   <p class="muted" style="margin:10px 0 0">${L('A couple follows along. Children automatically count as knowing their parents.','Et par følger med. Børn tæller automatisk som kendt af deres forældre.')}${none?' '+L(`${none} without a group.`,`${none} uden gruppe.`):''}</p></div>`:''}
  <div class="row"><button class="btn big grow" onclick="gdGo(S.guests.some(g=>g.type==='kid')?'kids':'names')">${L('Back','Tilbage')}</button><button class="btn primary big grow" onclick="gdGo('style')">${gs.length?L('Next','Næste'):L('Skip','Spring over')}</button></div>`;}
/* step 4: party style – one screen */
function gdSetStyle(id,v){const g=G(id);g.style=v==='easy'?undefined:v;commit();}
function gdStyleV(){const ad=S.guests.filter(g=>g.type==='adult'),c=k=>ad.filter(g=>(g.style||'easy')===k).length;
  return gdHead('style',L('How is each guest at a party?','Hvordan er hver gæst til fest?'),L('Only change the ones that stand out – everyone starts as “easy-going”. Quiet guests get someone they know beside them and are not squeezed between two talkative strangers; talkative guests are spread over the tables.','Ændr kun dem, der skiller sig ud – alle starter som “afslappet”. Stille gæster får en, de kender, ved siden af sig og bliver ikke klemt inde mellem to snakkesalige fremmede; de snakkesalige fordeles på bordene.'))+
  `<div class="card"><div class="muted" style="margin-bottom:8px">${c('talk')} ${L('talkative','snakkesalige')} · ${c('easy')} ${L('easy-going','afslappede')} · ${c('quiet')} ${L('quiet','stille')}</div><ul class="list gdstyle">${ad.map(g=>`<li><span class="grow">${esc(g.name)}</span>${seg(gdStyles(),g.style||'easy',`(v=>gdSetStyle(${g.id},v))`,g.name)}</li>`).join('')}</ul></div>
  <div class="row"><button class="btn big grow" onclick="gdGo('groups')">${L('Back','Tilbage')}</button><button class="btn primary big grow" onclick="gdGo('conflicts')">${L('Next','Næste')}</button></div>`;}
/* step 5: one card per guest */
const gdPeople=()=>S.guests.filter(g=>g.type==='adult');
const gdRule=(a,b)=>S.rules.find(r=>(r.type==='soft'||r.type==='no'||r.type==='nottable'||r.type==='diff')&&!(r.or||[]).length&&((r.a==a&&r.b==b)||(r.a==b&&r.b==a)));
function gdConf(a,b){const r=gdRule(a,b);if(r)S.rules=S.rules.filter(x=>x!==r);else S.rules.push({id:nid(),a,b,type:'no'});commit();}
function gdHow(a,b,t){const r=gdRule(a,b);if(r)r.type=t;commit();}
function gdConflicts(){const P=gdPeople(),i=Math.min(gdState().i,Math.max(0,P.length-1)),me=P[i];
  if(!me)return gdHead('conflicts',L('Who to keep apart','Hvem skal holdes adskilt'),L('There are no adults to ask about.','Der er ingen voksne at spørge om.'))+`<button class="btn primary big wide" onclick="gdGo('sum')">${L('Next','Næste')}</button>`;
  const others=S.guests.filter(g=>g.id!==me.id),picked=others.filter(o=>gdRule(me.id,o.id));
  return gdHead('conflicts',L(`Is there anyone ${esc(me.name)} doesn’t get along with?`,`Er der nogen, ${esc(me.name)} ikke går godt i spænd med?`),L(`Guest ${i+1} of ${P.length}. Most people have no one – then just tap “No one”.`,`Gæst ${i+1} af ${P.length}. De fleste har ingen – så tryk bare “Ingen”.`))+
  `<div class="gdbar" role="progressbar" aria-valuemin="0" aria-valuemax="${P.length}" aria-valuenow="${i+1}"><span style="width:${(i+1)/P.length*100}%"></span></div>
  <div class="card"><div class="lbl">${L('Tap names','Tryk på navne')}</div><div class="chips">${others.map(o=>`<button class="chip ${o.type==='kid'?'kid':''}" aria-pressed="${!!gdRule(me.id,o.id)}" onclick="gdConf(${me.id},${o.id})">${ic(o.type==='kid'?'baby':'user')} ${esc(o.name)}</button>`).join('')}</div></div>
  ${picked.map(o=>{const r=gdRule(me.id,o.id),t=r.type==='diff'?'nottable':r.type;return `<div class="card"><div class="lbl">${L(`How far apart should ${esc(me.name)} and ${esc(o.name)} be?`,`Hvor langt fra hinanden skal ${esc(me.name)} og ${esc(o.name)} sidde?`)}</div>
    <div class="gdopts" role="radiogroup">${[['soft','circle-minus',L('Rather not next to each other','Helst ikke ved siden af hinanden'),L('Not a real problem – just not best friends. Kept apart if it is easy.','Ikke et rigtigt problem – bare ikke bedste venner. Holdes adskilt, hvis det er nemt.')],['no','arrow-left-right',L('Not next to each other','Ikke ved siden af hinanden'),L('They may sit at the same table, just not side by side.','De må gerne sidde ved samme bord, bare ikke side om side.')],['nottable','split',L('Not at the same table','Ikke ved samme bord'),L('They are placed at different tables.','De bliver sat ved forskellige borde.')]].map(([v,icn,h,d])=>`<button class="gdopt" role="radio" aria-checked="${t===v}" onclick="gdHow(${me.id},${o.id},'${v}')">${ic(icn)}<span><b>${h}</b><small>${d}</small></span></button>`).join('')}</div></div>`;}).join('')}
  <div class="row"><button class="btn big grow" onclick="${i?`gdGo('conflicts',${i-1})`:`gdGo('style')`}">${L('Back','Tilbage')}</button>
  <button class="btn primary big grow" onclick="${i<P.length-1?`gdGo('conflicts',${i+1})`:`gdGo('sum')`}">${picked.length?L('Next','Næste'):L('No one','Ingen')}</button></div>
  ${i<P.length-1?`<button class="btn ghost wide" onclick="gdGo('sum')">${L('Skip the rest','Spring resten over')}</button>`:''}`;}
/* step 4: summary */
function gdFinish(){gdState().step='done';save();go('tables');toast(L('Now set up the tables – then press Seating','Sæt nu bordene op – tryk derefter på Bordplan'));}
function gdSum(){const kids=S.guests.filter(g=>g.type==='kid'),rs=S.rules.filter(r=>gdRule(r.a,r.b)===r);
  return gdHead('sum',L('All set','Klar'),L('This is what the guide created. Next you set up the tables, then the seating plan is made automatically. You can change everything afterwards under Guests and Rules.','Det her har guiden lavet. Bagefter sætter du bordene op, og så laves bordplanen automatisk. Du kan ændre alt bagefter under Gæster og Regler.'))+
  `<div class="card"><div class="kv"><span>${ic('users')} ${L('Guests','Gæster')}</span><b>${S.guests.length}</b></div><div class="kv"><span>${ic('baby')} ${L('Children with parents','Børn med forældre')}</span><b>${kids.filter(k=>(k.parents||[]).filter(G).length).length}/${kids.length}</b></div><div class="kv"><span>${ic('handshake')} ${L('Keep-apart rules','Hold-adskilt-regler')}</span><b>${rs.length}</b></div><div class="kv"><span>${ic('heart')} ${L('Couples seated together','Par sat sammen')}</span><b>${S.rules.filter(r=>r.couple).length}</b></div><div class="kv"><span>${ic('users-round')} ${L('Guests in a group','Gæster i en gruppe')}</span><b>${S.guests.filter(g=>g.type==='adult'&&g.group).length}/${S.guests.filter(g=>g.type==='adult').length}</b></div><div class="kv"><span>${ic('megaphone')} ${L('Talkative / quiet','Snakkesalige / stille')}</span><b>${S.guests.filter(g=>g.style==='talk').length} / ${S.guests.filter(g=>g.style==='quiet').length}</b></div></div>
  <div class="card"><div class="lbl">${ic('wand-sparkles')} ${L('The plan will automatically try to','Planen prøver automatisk at')}</div><ul class="gdlist"><li>${L('give everyone at least one person they know beside or across from them','give alle mindst én, de kender, ved siden af eller overfor')}</li><li>${L('keep quiet guests away from two talkative strangers','holde stille gæster væk fra to snakkesalige fremmede')}</li><li>${L('spread the talkative guests over the tables','fordele de snakkesalige på bordene')}</li></ul><p class="muted" style="margin:6px 0 0">${L('These are wishes, not rules – your own rules always win. Unmet wishes show as “Tip” on the seating plan.','Det er ønsker, ikke regler – dine egne regler vinder altid. Ikke-opfyldte ønsker vises som “Tip” på bordplanen.')}</p></div>
  ${rs.length?`<div class="card"><ul class="list">${rs.map(r=>`<li><span class="grow">${esc(ruleText(r))}</span></li>`).join('')}</ul></div>`:''}
  <div class="row"><button class="btn big grow" onclick="gdGo('conflicts',Math.max(0,gdPeople().length-1))">${L('Back','Tilbage')}</button><button class="btn primary big grow" onclick="gdFinish()">${L('Next: Tables','Næste: Borde')}</button></div>`;}
function vGuide(){const s=gdState().step;return `<div class="gd">${({names:gdNames,kids:gdKids,groups:gdGroupsV,style:gdStyleV,conflicts:gdConflicts,sum:gdSum}[s]||gdNames)()}</div>`;}
</script>
<script>
/* ---------- GUIDED SETUP (class mode) ----------
   Steps: names → level (high/middle/low, SYKL neighbouring levels) → seat needs → relations → rotation → summary.
   Uses S.guide (class storage is separate from event storage). */
function cgSteps(cur){const st=[['names',L('Students','Elever')],['level',L('Level','Niveau')],['needs',L('Seat needs','Pladsbehov')],['rel',L('Relations','Relationer')],['rot',L('Rotation','Rotation')],['sum',L('Summary','Oversigt')]],ci=st.findIndex(s=>s[0]===cur);
  return `<ol class="gdsteps" aria-label="${L('Guide steps','Guidens trin')}">${st.map((s,i)=>`<li class="${i<ci?'done':i===ci?'cur':''}" ${i===ci?'aria-current="step"':''}><span>${i<ci?ic('check'):i+1}</span>${s[1]}</li>`).join('')}</ol>`;}
function cgHead(cur,title,lead){return `<div class="gdtop">${cgSteps(cur)}<button class="btn ghost gdadv" onclick="gdAdvanced()">${ic('settings-2')} ${L('Advanced','Avanceret')}</button></div><h1>${title}</h1><p class="lead">${lead}</p>`;}
function cgNav(back,next,dis){return `<div class="row">${back?`<button class="btn big grow" onclick="gdGo('${back}')">${L('Back','Tilbage')}</button>`:''}<button class="btn primary big grow" ${dis?'disabled':''} onclick="gdGo('${next}')">${L('Next','Næste')}</button></div>`;}
function cgAdd(){const t=$('#gdIn'),ls=t.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!ls.length)return t.focus();
  ls.forEach(l=>{const n=l.replace(/[+\-]$/,'').trim();if(n)S.guests.push({id:nid(),name:n,type:'adult',level:/\+$/.test(l)?'strong':/-$/.test(l)?'support':'mid',parents:[],pmode:'next'});});t.value='';commit();$('#gdIn').focus();}
function cgNames(){const gs=S.guests;
  return cgHead('names',L('Who is in the class?','Hvem går i klassen?'),L('Write every student’s name, one per line or separated by commas. Your list stays in this browser – nothing is sent anywhere.','Skriv alle elevernes navne, ét pr. linje eller adskilt med komma. Listen bliver i denne browser – intet sendes nogen steder hen.'))+
  `<div class="card"><label class="lbl" for="gdIn">${L('Names','Navne')}</label><textarea class="field" id="gdIn" rows="6" placeholder="Anna&#10;Bo&#10;Carl" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))cgAdd()"></textarea>
   <div class="row" style="margin-top:10px"><button class="btn primary" onclick="cgAdd()">${ic('plus')} ${L('Add','Tilføj')}</button></div></div>
  ${gs.length?`<div class="card"><div class="lbl">${gs.length} ${L('students','elever')}</div><div class="chips">${gs.map(g=>`<span class="gdname"><span class="chip">${ic('graduation-cap')} ${esc(g.name)}</span><button class="icon sm" aria-label="${L('Remove','Fjern')} ${esc(g.name)}" onclick="gdDel(${g.id})">${ic('x')}</button></span>`).join('')}</div></div>`:''}`+cgNav('','level',!gs.length);}
function cgLv(id,v){G(id).level=v;commit();}
function cgLevel(){const c=k=>S.guests.filter(g=>(g.level||'mid')===k).length,n=S.guests.length||1;
  return cgHead('level',L('Academic level','Fagligt niveau'),L('Split the class into three: about a quarter high, half middle and a quarter low. Partners are then paired by neighbouring levels – high with middle, middle with low, never high with low. This is the rule from the Danish SYKL research on student pairs: students help each other best when they are close in level, and both get to explain.','Del klassen i tre: cirka en fjerdedel høj, halvdelen middel og en fjerdedel lav. Makkere sættes så sammen efter nabo-niveauer – høj med middel, middel med lav, aldrig høj med lav. Det er reglen fra den danske SYKL-forskning i elevmakkere: elever hjælper hinanden bedst, når de er tæt på hinanden fagligt, og begge får lov at forklare.'))+
  `<div class="card"><div class="row" style="gap:14px">${Object.keys(LV).map(k=>`<span><span class="lvd" style="background:${LV[k].c}"></span> <b>${lvName(k)}</b> ${c(k)} <span class="muted">(${Math.round(100*c(k)/n)}% · ${L('aim','mål')} ${k==='mid'?50:25}%)</span></span>`).join('')}</div></div>
  <div class="card"><ul class="list">${S.guests.map(g=>`<li><span class="grow"><b>${esc(g.name)}</b></span>${seg(Object.keys(LV).map(k=>[k,`<span class="lvd" style="background:${LV[k].c}"></span>`+lvName(k)]),g.level||'mid',`(v=>cgLv(${g.id},v))`,L('Level','Niveau')+' '+g.name)}</li>`).join('')}</ul></div>`+cgNav('names','needs');}
function cgFront(id){const g=G(id);g.front=g.front?undefined:true;commit();}
function cgNeeds(){const n=S.guests.filter(g=>g.front).length;
  return cgHead('needs',L('Who needs to sit near the board?','Hvem skal sidde tæt på tavlen?'),L('Tap the students who should sit in the front – for example because of eyesight, hearing, or because they concentrate better close to the teacher (common advice for students with ADHD). Skip this if nobody needs it.','Tryk på de elever, der skal sidde forrest – fx på grund af syn, hørelse, eller fordi de koncentrerer sig bedre tæt på læreren (et almindeligt råd for elever med ADHD). Spring over, hvis ingen har brug for det.'))+
  `<div class="card"><div class="lbl">${ic('presentation')} ${n} ${L('near the board','tæt på tavlen')}</div><div class="chips">${S.guests.map(g=>`<button class="chip" aria-pressed="${!!g.front}" onclick="cgFront(${g.id})">${g.front?ic('presentation')+' ':''}${esc(g.name)}</button>`).join('')}</div></div>`+cgNav('level','rel');}
function cgPick(id){gdState().cur=id;save();render();}
function cgRel(b){const a=gdState().cur;if(!a||a==b)return;const r=S.rules.find(r=>(r.a==a&&r.b==b||r.a==b&&r.b==a)&&!(r.or||[]).length&&(r.type==='yes'||r.type==='no'));
  if(!r)S.rules.push({id:nid(),a,b,type:'yes'});else if(r.type==='yes')r.type='no';else S.rules=S.rules.filter(x=>x!==r);commit();}
function cgRelV(){const st=gdState(),gs=S.guests,cur=G(st.cur)?st.cur:(gs[0]||{}).id;st.cur=cur;
  const rel=b=>{const r=S.rules.find(r=>(r.a==cur&&r.b==b||r.a==b&&r.b==cur)&&!(r.or||[]).length&&(r.type==='yes'||r.type==='no'));return r?r.type:'';};
  const all=S.rules.filter(r=>(r.type==='yes'||r.type==='no')&&!(r.or||[]).length);
  return cgHead('rel',L('Who works well together – and who doesn’t?','Hvem arbejder godt sammen – og hvem gør ikke?'),L('Choose a student, then tap a classmate: once for “works well together”, twice for “keep apart”, three times to clear. Use it sparingly – mixing across friendships builds the class community.','Vælg en elev, og tryk så på en klassekammerat: én gang for “arbejder godt sammen”, to gange for “hold adskilt”, tre gange for at fjerne. Brug det med måde – at blande på tværs af venskaber styrker klassefællesskabet.'))+
  `<div class="card"><div class="lbl">${L('Student','Elev')}</div><div class="chips">${gs.map(g=>`<button class="chip" aria-pressed="${g.id==cur}" onclick="cgPick(${g.id})">${esc(g.name)}</button>`).join('')}</div></div>
  ${cur?`<div class="card"><div class="lbl">${L('Classmates of','Klassekammerater til')} <b>${esc(G(cur).name)}</b></div><div class="chips">${gs.filter(g=>g.id!=cur).map(g=>{const t=rel(g.id);return `<button class="chip ${t==='no'?'bad':''}" aria-pressed="${!!t}" onclick="cgRel(${g.id})">${t==='yes'?ic('handshake')+' ':t==='no'?ic('ban')+' ':''}${esc(g.name)}</button>`;}).join('')}</div></div>`:''}
  ${all.length?`<div class="card"><ul class="list">${all.map(r=>`<li><span class="ri">${ic(r.type==='yes'?'handshake':'ban')}</span><span class="grow">${esc(ruleText(r))}</span></li>`).join('')}</ul></div>`:''}`+cgNav('needs','rot');}
function cgSet(k,v){S.settings[k]=v;commit();}
function cgRot(){const w=S.settings.rot||2;
  return cgHead('rot',L('How often do they change seats?','Hvor tit skifter de plads?'),L('Danish teaching advice is to change seats or partners every 1–2 weeks with a visible random draw, so the students accept the plan. Change on a Wednesday or Thursday – not on a Monday or right after a holiday.','Dansk undervisningsråd er at skifte pladser eller makkere hver 1.–2. uge med en synlig lodtrækning, så eleverne accepterer planen. Skift om onsdagen eller torsdagen – ikke om mandagen eller lige efter en ferie.'))+
  `<div class="card"><div class="lbl">${ic('calendar')} ${L('New seats every','Nye pladser hver')}</div>${seg([['1',L('week','uge')],['2',L('2 weeks','2. uge')],['4',L('4 weeks','4. uge')]],String(w),"(v=>cgSet('rot',+v))",L('Rotation','Rotation'))}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><span><b>${ic('history')} ${L('New partners each time','Nye makkere hver gang')}</b><br><span class="muted">${L('The app remembers the last four plans you save and tries to avoid seating the same two together again.','Appen husker de sidste fire planer, du gemmer, og prøver at undgå at sætte de samme to sammen igen.')}</span></span>${sw(S.settings.fresh!==false,"(v=>cgSet('fresh',v))",L('New partners each time','Nye makkere hver gang'))}</div></div>`+cgNav('rel','sum');}
function cgFinish(){gdState().step='done';save();go('plan');}
function cgSum(){const c=k=>S.guests.filter(g=>(g.level||'mid')===k).length,rs=S.rules.filter(r=>r.type==='yes'||r.type==='no');
  return cgHead('sum',L('All set','Klar'),L('This is what the guide created. Press “Arrange seats” on the next screen. You can change everything afterwards under Students and Rules, and move desks under Tables.','Det her har guiden lavet. Tryk “Placér elever” på næste skærm. Du kan ændre alt bagefter under Elever og Regler og flytte borde under Borde.'))+
  `<div class="card"><div class="kv"><span>${ic('graduation-cap')} ${L('Students','Elever')}</span><b>${S.guests.length}</b></div><div class="kv"><span>${ic('users')} ${L('High / middle / low','Høj / middel / lav')}</span><b>${c('strong')} / ${c('mid')} / ${c('support')}</b></div><div class="kv"><span>${ic('presentation')} ${L('Near the board','Tæt på tavlen')}</span><b>${S.guests.filter(g=>g.front).length}</b></div><div class="kv"><span>${ic('handshake')} ${L('Work well together','Arbejder godt sammen')}</span><b>${rs.filter(r=>r.type==='yes').length}</b></div><div class="kv"><span>${ic('ban')} ${L('Keep apart','Hold adskilt')}</span><b>${rs.filter(r=>r.type==='no').length}</b></div><div class="kv"><span>${ic('calendar')} ${L('New seats every','Nye pladser hver')}</span><b>${S.settings.rot||2} ${L('week(s)','uge(r)')}</b></div></div>
  <div class="card"><div class="lbl">${ic('wand-sparkles')} ${L('The plan will automatically try to','Planen prøver automatisk at')}</div><ul class="gdlist"><li>${L('pair neighbouring levels: high with middle, middle with low – never high with low','sætte nabo-niveauer sammen: høj med middel, middel med lav – aldrig høj med lav')}</li><li>${L('seat the chosen students near the board','sætte de valgte elever tæt på tavlen')}</li><li>${L('follow your “works well together” and “keep apart” choices','følge dine valg om “arbejder godt sammen” og “hold adskilt”')}</li>${S.settings.fresh!==false?`<li>${L('give everyone new partners compared with the last saved plans','give alle nye makkere i forhold til de sidst gemte planer')}</li>`:''}</ul></div>
  <div class="row"><button class="btn big grow" onclick="gdGo('rot')">${L('Back','Tilbage')}</button><button class="btn primary big grow" onclick="cgFinish()">${L('Next: Seating','Næste: Bordplan')}</button></div>`;}
function vCGuide(){const s=gdState().step;return `<div class="gd">${({names:cgNames,level:cgLevel,needs:cgNeeds,rel:cgRelV,rot:cgRot,sum:cgSum}[s]||cgNames)()}</div>`;}
/* seat history (class): save the current neighbour pairs so the next plan can give new partners */
function curPairs(){const seats=allSeats(),A=S.assign||{},out=new Set();for(const k in seats){const a=A[k];if(a==null)continue;seats[k].nb.forEach(n=>{const b=A[n];if(b!=null&&b!=a)out.add(Math.min(a,b)+'-'+Math.max(a,b));});}return[...out];}
function savePeriod(){S.history=(S.history||[]).concat([{d:Date.now(),pairs:curPairs()}]).slice(-8);commit();toast(L('Saved – the next plan will try to give new partners','Gemt – næste plan prøver at give nye makkere'));}
function nextChange(){const h=(S.history||[]).slice(-1)[0];if(!h)return '';const d=new Date(h.d+(S.settings.rot||2)*7*864e5);while(d.getDay()!==3)d.setDate(d.getDate()+(d.getDay()<3?1:-1));return d.toLocaleDateString(LANG==='da'?'da-DK':'en-GB',{weekday:'long',day:'numeric',month:'long'});}
</script>
<script>
/* ---------- PLAN ---------- */
function seatEl(k,ev,extraCls){const gid=(S.assign||{})[k],g=gid!=null&&G(gid),lk=S.locked[k]!=null;
  return `<div class="seat ${CM&&g?'lv-'+(g.level||'mid'):''} ${g?g.type:'empty'} ${ev.bad.has(k)?'bad':''} ${sel===k?'sel':''} ${lk?'locked':''} ${extraCls||''}" data-k="${k}" ${g?`data-g="${g.id}"`:''} role="button" tabindex="0" aria-label="${g?esc(g.name):L('Empty seat','Tom plads')}${lk?' ('+L('locked','låst')+')':''}">${g?esc(g.name)+`<button class="lk" tabindex="-1" aria-label="${lk?L('Unlock','Lås op'):L('Lock to this seat','Lås til pladsen')}" title="${lk?L('Unlock','Lås op'):L('Lock to this seat','Lås til pladsen')}" data-lock="${k}">${lk?ic('lock'):ic('lock-open')}</button>`:L('empty','tom')}</div>`;}
function drawing(gs,ev,blocked,boardsMovable){
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  gs.forEach(g=>{[[g.box[0],g.box[1]],[g.box[2],g.box[3]],...g.seats.map(q=>[q.x,q.y])].forEach(([a,b])=>{mnx=Math.min(mnx,a);mny=Math.min(mny,b);mxx=Math.max(mxx,a);mxy=Math.max(mxy,b);});});
  const cb=CM&&gs.length>1?90:0,ox=50-mnx,oy=26-mny+cb,W=mxx-mnx+100,H=mxy-mny+52+cb;
  return {W,H,html:`<div class="inner" style="width:${W}px;height:${H}px">`+(cb?`<div class="chalk" style="left:${Math.max(30,W*.2)}px;width:${W-2*Math.max(30,W*.2)}px">${ic('presentation')} ${L('Board','Tavle')}</div>`:'')+gs.map(g=>{const b=g.box;
    return `<div class="board ${boardsMovable?'move':''} ${g.t.desk?'desk':''} ${b[3]-b[1]>b[2]-b[0]?'vert':''}" ${boardsMovable?`data-t="${g.t.id}"`:''} style="left:${b[0]+ox}px;top:${b[1]+oy}px;width:${b[2]-b[0]}px;height:${b[3]-b[1]}px;${g.round?'border-radius:50%':''}">${esc(g.t.name)}${boardsMovable&&CM?`<button class="trot" data-rot="${g.t.id}" aria-label="${L('Turn','Drej')} ${esc(g.t.name)}" title="${L('Turn 90°','Drej 90°')}">${ic('rotate-cw')}</button>`:''}</div>`+
      g.seats.filter(q=>!blocked||!blocked.has(q.key)).map(q=>seatEl(q.key,ev,'" style="left:'+(q.x+ox-44)+'px;top:'+(q.y+oy-20)+'px')).join('');}).join('')+'</div>'};
}
function fitAll(){const mx=innerWidth>=1000?1.6:1;document.querySelectorAll('#main .fit').forEach(f=>{const W=+f.dataset.w,H=+f.dataset.h,s=Math.min(mx,f.clientWidth/W);f.style.height=H*s+'px';f.firstElementChild.style.transform=`scale(${s})`;});}
new ResizeObserver(()=>{fitAll();if(view==='plan'&&!S.settings.floor){const w=innerWidth<500;if(w!==fitAll._n){fitAll._n=w;render();}}}).observe(document.documentElement);
function vPlan(){
  const seats=allSeats(),ev=evaluate(S.assign||{},seats,true),assigned=Object.values(S.assign||{}).filter(v=>v!=null).length;
  const unseated=S.guests.filter(g=>!Object.values(S.assign||{}).includes(g.id));
  let st;
  if(!S.guests.length)st=`<div class="status">${L('Add guests first.','Tilføj gæster først.')} <button class="btn ghost" onclick="go('guests')">${L('Go to guests','Gå til gæster')}</button></div>`;
  else if(!assigned)st=`<div class="status">${L('Press “Arrange seats” and the planner places everyone for you. Then drag or tap two seats to swap.','Tryk “Placér gæster”, så placerer planlæggeren alle for dig. Træk eller tryk på to pladser for at bytte.')}</div>`;
  else{const tips=ev.issues.filter(x=>/^Tip:/.test(x)),probs=ev.issues.filter(x=>!/^Tip:/.test(x));ev.issues=probs;st=(ev.issues.length?`<div class="status bad" role="status"><b>${ic('triangle-alert')} ${ev.issues.length} ${L('problem(s)','problem(er)')}</b> – ${L('arrange again, add seats or relax rules','placér igen, tilføj pladser eller løsn reglerne')}<ul>${ev.issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:`<div class="status ok" role="status"><b>${ic('check')} ${L('All rules satisfied','Alle regler er opfyldt')}</b></div>`)+(tips.length?`<div class="status" role="note"><b>${ic('lightbulb')} ${tips.length} ${L('suggestion(s)','forslag')}</b> – ${L('wishes from the guided setup, not rules','ønsker fra guiden, ikke regler')}<ul>${tips.map(i=>`<li>${esc(i.replace(/^Tip: /,''))}</li>`).join('')}</ul></div>`:'');}
  let body;
  if(S.settings.floor){const F=floorInfo(),d=drawing(F.gs,ev,F.blocked,moveMode||CM);
    body=`<div class="tcard"><div class="fit" data-w="${d.W}" data-h="${d.H}">${d.html}</div></div>`;}
  else{const narrow=innerWidth<500;fitAll._n=narrow;
    body=`<div class="tables">${S.tables.map(t=>{const g=tableGeom({...t,x:0,y:0,rot:0}),d=drawing([g],ev);
      const list=narrow&&(t.shape==='round'?t.side>8:LEN(t)>3);
      return `<section class="tcard" aria-label="${esc(t.name)}"><h3><span>${t.kids?ic('baby')+' ':''}${esc(t.name)}</span><span class="muted">${seatsOf(t).filter(s=>S.assign?.[s.key]!=null).length}/${capOf(t)}</span></h3>${list?`<ol class="slist">${seatsOf(t).order.map((s,i)=>`<li><span class="no">${i+1}</span>${seatEl(s.key,ev)}</li>`).join('')}</ol>`:`<div class="fit" data-w="${d.W}" data-h="${d.H}">${d.html}</div>`}</section>`;}).join('')}</div>`;}
  return `<h1 class="sr">${L('Seating','Bordplan')}</h1>
  <div class="planbar"><button class="btn primary big" onclick="doArrange()" ${S.guests.length?'':'disabled'}>${ic('shuffle')} ${assigned?L('Arrange again','Placér igen'):L('Arrange seats','Placér gæster')}</button>${CM&&assigned?`<button class="btn" onclick="savePeriod()" title="${L('Remember these partners so the next plan gives new ones','Husk disse makkere, så næste plan giver nye')}">${ic('history')} ${L('Save as current seating','Gem som nuværende pladser')}</button>${nextChange()?`<span class="muted">${ic('calendar')} ${L('Next change','Næste skift')}: ${nextChange()}</span>`:''}`:''}
   ${assigned?`<button class="btn" onclick="if(confirm('${L('Clear all seats and locks?','Ryd alle pladser og låse?')}')){S.assign={};S.locked={};commit()}">${L('Clear','Ryd')}</button>`:''}
   ${S.settings.floor&&!CM?`<button class="btn" aria-pressed="${moveMode}" onclick="moveMode=!moveMode;render()">${moveMode?ic('check')+' '+L('Done moving','Færdig'):ic('move')+' '+L('Move tables','Flyt borde')}</button><button class="btn" onclick="rotSheet()">${ic('rotate-cw')} ${L('Turn','Drej')}</button>`:''}
   <span class="grow"></span><button class="btn" onclick="printSheet()">${ic('printer')} ${L('Print','Udskriv')}</button></div>
  ${st}
  ${assigned&&unseated.length||sel==='tray'?`<div class="tray" data-tray="1" aria-label="${L('Not seated','Ikke placeret')}"><span class="muted">${L('Not seated:','Ikke placeret:')}</span>${unseated.map(g=>`<div class="chip ${g.type==='kid'?'kid':''}" data-g="${g.id}" role="button" tabindex="0" style="cursor:grab">${esc(g.name)}</div>`).join('')}</div>`:''}
  ${moveMode||(CM&&S.settings.floor)?`<p class="muted">${CM?L('Drag a desk to move it – drop it close to another and they join. Use the turn button to turn it 90°; joined desks turn together.','Træk et bord for at flytte det – slip det tæt på et andet, så sættes de sammen. Brug drej-knappen for at dreje det 90°; sammensatte borde drejer sammen.'):''}${CM?'':L('Drag a table to move it – drop it close to another and they snap together. Tap a table to turn it 90°; joined tables turn together.','Træk et bord for at flytte det – slip det tæt på et andet, så sættes de sammen. Tryk på et bord for at dreje det 90°; sammensatte borde drejer sammen.')}</p>`:''}
  ${body}
  <p class="muted" style="margin-top:12px">${L('Tip: drag a guest onto a seat (on touch: press and hold, then drag), or tap two seats to swap. The lock keeps a guest in place when you arrange again.','Tip: træk en gæst hen på en plads (på touch: hold fingeren nede og træk), eller tryk på to pladser for at bytte. Låsen holder gæsten på pladsen når du placerer igen.')}</p>`;
}
function doArrange(){const r=arrange();sel=null;if(r.error){alert(r.error);return;}commit();const ev=evaluate(S.assign,allSeats(),true);ev.issues=ev.issues.filter(x=>!/^Tip:/.test(x));toast(ev.issues.length?L(`${ev.issues.length} problem(s) left`,`${ev.issues.length} problem(er) tilbage`):L('All rules satisfied','Alle regler er opfyldt'));}
function rotSheet(){const rs=S.tables.filter(t=>t.shape==='rect');
  $('#dlg').innerHTML=`<div class="sh"><h3 id="dlgT">${L('Turn tables 90°','Drej borde 90°')}</h3><button class="icon" aria-label="${L('Close','Luk')}" onclick="closeDlg()">${ic('x')}</button></div><div class="sb"><div class="chips">${rs.map(t=>`<button class="chip" onclick="rotGroup(${t.id})">${esc(t.name)}</button>`).join('')||L('No long tables.','Ingen langborde.')}</div></div>`;openDlg();}
/* seat interactions */
function lockSeat(k){if(S.locked[k]!=null)delete S.locked[k];else if(S.assign[k]!=null)S.locked[k]=S.assign[k];commit();}
function swapSeats(a,b){const A=S.assign[a]??null,B=S.assign[b]??null;S.assign[a]=B;S.assign[b]=A;
  const la=S.locked[a],lb=S.locked[b];delete S.locked[a];delete S.locked[b];if(la!=null&&B!=null)S.locked[a]=B;if(lb!=null&&A!=null)S.locked[b]=A;}
function placeGuest(gid,k){gid=+gid;const from=Object.keys(S.assign).find(x=>S.assign[x]===gid);
  if(from){if(from===k)return;swapSeats(from,k);}else{const prev=S.assign[k];if(prev!=null)delete S.locked[k];S.assign[k]=gid;}
  S.locked[k]=gid;commit();toast(L(`${G(gid).name} placed and locked`,`${G(gid).name} placeret og låst`));}
function unseat(gid){for(const k in S.assign)if(S.assign[k]==gid){S.assign[k]=null;delete S.locked[k];}commit();}
function tapSeat(k){
  if(sel&&sel.startsWith&&sel.startsWith('g:')){placeGuest(sel.slice(2),k);sel=null;render();return;}
  if(sel==null){if(S.assign[k]==null){return;}sel=k;render();toast(L('Now tap another seat to swap','Tryk nu på en anden plads for at bytte'));return;}
  if(sel===k){sel=null;render();return;}
  swapSeats(sel,k);sel=null;commit();}
$('#main').addEventListener('click',e=>{if(justDragged){justDragged=false;return;}
  const lk=e.target.closest('[data-lock]');if(lk){e.stopPropagation();lockSeat(lk.dataset.lock);return;}
  const s=e.target.closest('.seat[data-k]');if(s){tapSeat(s.dataset.k);return;}
  const c=e.target.closest('.tray [data-g]');if(c){sel=sel==='g:'+c.dataset.g?null:'g:'+c.dataset.g;render();if(sel)toast(L('Tap a seat for this guest','Tryk på en plads til gæsten'));}});
$('#main').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.seat,[data-g][role=button]')){e.preventDefault();e.target.click();}});
/* pointer drag – works for mouse, pen and touch (touch: long-press) */
let DR=null;
document.addEventListener('pointerdown',e=>{
  if(e.button>0||e.target.closest('[data-lock]'))return;
  const b=e.target.closest('.board[data-t]');
  const rb=e.target.closest('[data-rot]');if(rb){e.preventDefault();e.stopPropagation();justDragged=true;setTimeout(()=>justDragged=false,50);rotGroup(+rb.dataset.rot);return;}
  if(b&&(moveMode||CM)){const t=S.tables.find(t=>t.id==b.dataset.t),sc=b.closest('.inner').getBoundingClientRect().width/b.closest('.inner').offsetWidth;
    DR={kind:'table',t,sx:e.clientX,sy:e.clientY,x0:t.x||0,y0:t.y||0,sc,el:b,on:true};b.setPointerCapture(e.pointerId);e.preventDefault();return;}
  const src=e.target.closest('[data-g]');if(!src||!$('#main').contains(src))return;
  DR={kind:'guest',gid:src.dataset.g,sx:e.clientX,sy:e.clientY,on:false,touch:e.pointerType!=='mouse'};
  if(DR.touch)DR.timer=setTimeout(()=>{if(DR&&!DR.on)startDrag(e.clientX,e.clientY);},280);
});
function startDrag(x,y){DR.on=true;document.body.classList.add('dragging');navigator.vibrate&&navigator.vibrate(15);
  const gh=document.createElement('div');gh.className='dragghost';gh.textContent=G(DR.gid).name;document.body.appendChild(gh);DR.gh=gh;moveGhost(x,y);}
function moveGhost(x,y){DR.gh.style.left=x+'px';DR.gh.style.top=y+'px';document.querySelectorAll('.over').forEach(o=>o.classList.remove('over'));
  const t=document.elementFromPoint(x,y),tg=t&&(t.closest('.seat[data-k]')||t.closest('[data-tray]'));if(tg)tg.classList.add('over');}
document.addEventListener('pointermove',e=>{if(!DR)return;const dx=e.clientX-DR.sx,dy=e.clientY-DR.sy;
  if(DR.kind==='table'){DR.t.x=Math.round(DR.x0+dx/DR.sc);DR.t.y=Math.round(DR.y0+dy/DR.sc);DR.el.style.transform=`translate(${dx/DR.sc}px,${dy/DR.sc}px)`;return;}
  if(!DR.on){if(Math.hypot(dx,dy)>8){if(DR.touch){clearTimeout(DR.timer);DR=null;}else startDrag(e.clientX,e.clientY);}return;}
  moveGhost(e.clientX,e.clientY);});
document.addEventListener('touchmove',e=>{if(DR&&DR.on)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(DR&&DR.touch)e.preventDefault();});
function endDrag(e,cancel){if(!DR)return;clearTimeout(DR.timer);const d=DR;DR=null;
  if(d.kind==='table'){if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<6){d.t.x=d.x0;d.t.y=d.y0;justDragged=true;setTimeout(()=>justDragged=false,50);if(!cancel&&moveMode)rotGroup(d.t.id);return;}snapTable(d.t);commit();return;}
  if(!d.on)return;document.body.classList.remove('dragging');d.gh.remove();justDragged=true;setTimeout(()=>justDragged=false,50);
  document.querySelectorAll('.over').forEach(o=>o.classList.remove('over'));if(cancel)return;
  const t=document.elementFromPoint(e.clientX,e.clientY);if(!t)return;
  const s=t.closest('.seat[data-k]');if(s){placeGuest(d.gid,s.dataset.k);return;}
  if(t.closest('[data-tray]')){unseat(d.gid);}}
document.addEventListener('pointerup',e=>endDrag(e));
document.addEventListener('pointercancel',e=>endDrag(e,true));

function closeDlg(){$('#dlg').close();}
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))closeDlg();});

  $('#dlg').innerHTML=`<div class="sh"><h3 id="dlgT">${L('Privacy & cookies','Privatliv og cookies')}</h3><button class="icon" aria-label="${L('Close','Luk')}" onclick="closeDlg()">${ic('x')}</button></div><div class="sb">

  <p>${L('Made by','Lavet af')} <a href="https://github.com/ksk-itdk" target="_blank" rel="noopener">KSKIT</a>. ${L('Free to reuse and change under the','Må frit genbruges og ændres under')} <a href="LICENSE" target="_blank">${L('MIT license','MIT-licensen')}</a> ${L('– just keep the credit to KSKIT.','– bevar blot krediteringen af KSKIT.')}</p>
  </div><div class="sf"><button class="btn primary" onclick="closeDlg()">${L('OK','OK')}</button></div>`;openDlg();}
function openMenu(){
  $('#dlg').innerHTML=`<div class="sh"><h3 id="dlgT">${L('Menu','Menu')}</h3><button class="icon" aria-label="${L('Close','Luk')}" onclick="closeDlg()">${ic('x')}</button></div><div class="sb"><div class="menu">
   <div class="kv" style="padding:4px 8px"><span>${ic('globe')} ${L('Language','Sprog')}</span>${seg([['da','Dansk'],['en','English']],LANG,'setLang')}</div><div class="kv" style="padding:4px 8px"><span>${ic('layout-grid')} ${L('Plan type','Plantype')}</span>${seg([['event',LANG==='da'?'Begivenhed':'Event'],['class',L('School class','Skoleklasse')]],MODE,'setMode')}</div><div class="kv" style="padding:4px 8px"><span>${ic(THEME==='light'?'sun':'moon')} ${L('Theme','Tema')}</span>${seg([['dark',L('Dark','Mørk')],['light',L('Light','Lys')]],THEME,'setTheme')}</div><hr>
   ${CM?'':`<button onclick="closeDlg();gdRestart()">${ic('list-checks')} ${L('Guided setup','Guidet opsætning')}</button>`}
   <button onclick="closeDlg();shareLink()">${ic('link')} ${L('Copy share link','Kopiér delingslink')}</button>
   <button onclick="closeDlg();printSheet()">${ic('printer')} ${L('Print…','Udskriv…')}</button>
   <button onclick="closeDlg();exportJSON()">${ic('download')} ${L('Save plan to file','Gem plan som fil')}</button>

   <button onclick="startOver()" class="bad">${ic('trash-2')} ${L('Start over','Start forfra')}</button><hr>

   <a href="agents.md">${ic('bot')} ${L('For AI agents','Til AI-agenter')}</a>
   <p class="muted" style="padding:0 8px">${L('Your plan is stored only in this browser. Use a share link or file to move it to another device.','Din plan gemmes kun i denne browser. Brug et delingslink eller en fil for at flytte den til en anden enhed.')}</p>
  </div></div>`;openDlg();}

/* ---------- print ---------- */
function printSheet(){
  $('#dlg').innerHTML=`<div class="sh"><h3 id="dlgT">${L('Print','Udskriv')}</h3><button class="icon" aria-label="${L('Close','Luk')}" onclick="closeDlg()">${ic('x')}</button></div><div class="sb">
   ${[['pPlan',L('Table plan','Bordplan'),1],['pList',L('Alphabetical guest list (find your seat)','Alfabetisk gæsteliste (find din plads)'),1],['pCards',L('Place cards (fold in the middle)','Bordkort (fold på midten)'),0]].map(([id,t,on])=>`<div class="kv"><label for="${id}" class="grow">${t}</label><span class="switch"><input type="checkbox" role="switch" id="${id}" ${on?'checked':''}><span></span></span></div>`).join('')}
  </div><div class="sf"><button class="btn" onclick="closeDlg()">${L('Cancel','Annullér')}</button><button class="btn primary" onclick="doPrint()">${ic('printer')} ${L('Print','Udskriv')}</button></div>`;openDlg();}
function seatTable(){const out=[];S.tables.forEach(t=>seatsOf(t).order.forEach((s,i)=>{const g=G(S.assign?.[s.key]);if(g)out.push({g,t,n:i+1});}));return out;}
function doPrint(){const p=$('#pPlan').checked,l=$('#pList').checked,c=$('#pCards').checked;closeDlg();
  const ev={bad:new Set()},st=seatTable();let h=`<h1>${esc(S.event||L('Seating plan','Bordplan'))}</h1>`;
  if(p){if(S.settings.floor){const F=floorInfo(),d=drawing(F.gs,ev,F.blocked);h+=`<div class="pt fit" data-w="${d.W}" data-h="${d.H}" style="width:100%">${d.html}</div>`;}
    else h+=S.tables.map(t=>{const d=drawing([tableGeom({...t,x:0,y:0,rot:0})],ev);return `<div class="pt"><h2>${esc(t.name)}</h2><div class="fit" data-w="${d.W}" data-h="${d.H}">${d.html}</div></div>`;}).join('');}
  if(l)h+=`<h2 style="break-before:${p?'page':'auto'}">${L('Find your seat','Find din plads')}</h2><div class="glist">${st.sort((a,b)=>a.g.name.localeCompare(b.g.name,LANG)).map(x=>`<div>${esc(x.g.name)} — <b>${esc(x.t.name)}</b>, ${L('seat','plads')} ${x.n}</div>`).join('')}</div>`;
  if(c)h+=`<div class="cards" style="break-before:${p||l?'page':'auto'}">${st.map(x=>`<div class="pc"><div>${esc(x.g.name)}<small>${esc(x.t.name)}</small></div><div>${esc(x.g.name)}<small>${esc(x.t.name)}</small></div></div>`).join('')}</div>`;
  const pa=$('#printArea');pa.innerHTML=h;pa.style.display='block';pa.style.width='180mm';
  pa.querySelectorAll('.fit').forEach(f=>{const W=+f.dataset.w,H=+f.dataset.h,s=Math.min(1,f.clientWidth/W);f.style.height=H*s+'px';f.firstElementChild.style.transform=`scale(${s})`;});
  pa.style.display='';setTimeout(()=>print(),50);}

/* ---------- files / share ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}
function askOk(title,msg,ok,fn,bad){window.__ok=fn;$('#dlg').innerHTML=`<div class="sh"><h3 id="dlgT">${title}</h3><button class="icon" aria-label="${L('Close','Luk')}" onclick="closeDlg()">${ic('x')}</button></div><div class="sb"><p style="margin:0">${msg}</p></div><div class="sf"><button class="btn" onclick="closeDlg()">${L('Cancel','Annuller')}</button><button class="btn ${bad?'danger':'primary'}" onclick="closeDlg();__ok()">${ok}</button></div>`;openDlg();}
function newEvent(){askOk(L('New event','Ny begivenhed'),L('Tables, guests and rules are kept, seating is cleared.','Borde, gæster og regler bevares, pladserne ryddes.'),L('Start new event','Start ny begivenhed'),()=>{S.assign={};S.locked={};S.event='';commit();});}
function startOver(){askOk(L('Start over','Start forfra'),CM?L('This deletes every student, group, rule and the seating in this class plan.','Dette sletter alle elever, grupper, regler og pladser i denne klasseplan.'):L('This deletes every guest, table, rule and the seating in this event plan. The guided setup starts again.','Dette sletter alle gæster, borde, regler og pladser i denne plan. Den guidede opsætning starter forfra.'),L('Delete everything','Slet alt'),()=>{S=CM?blankClass():blank();if(!CM)S.guide={step:'names',i:0};save();go(CM?'tables':'guide');toast(L('Everything was deleted','Alt er slettet'));},1);}
async function z(str,inv){const cs=inv?new DecompressionStream('deflate-raw'):new CompressionStream('deflate-raw');return new Response(new Blob([str]).stream().pipeThrough(cs)).arrayBuffer();}
async function shareLink(){const d={...S};d.assign=Object.fromEntries(Object.entries(d.assign||{}).filter(([k,v])=>v!=null));
  const b=new Uint8Array(await z(JSON.stringify(d)));let bin='';b.forEach(c=>bin+=String.fromCharCode(c));
  const url=location.origin+location.pathname+'#d='+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({title:S.event||L('Seating plan','Bordplan'),url});return;}catch(e){}}
  try{await navigator.clipboard.writeText(url);toast(L('Share link copied','Delingslink kopieret'));}catch(e){prompt(L('Copy this link:','Kopiér dette link:'),url);}}
async function loadShare(){const m=location.hash.match(/^#d=([\w-]+)/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);
  try{const s=atob(m[1].replace(/-/g,'+').replace(/_/g,'/')),b=Uint8Array.from(s,c=>c.charCodeAt(0));const d=JSON.parse(new TextDecoder().decode(await z(b,1)));
    if(!d.tables||!d.guests)throw 0;if(!confirm(L('Open the shared plan','Åbn den delte plan')+' "'+(d.event||'')+'"? '+L('This replaces the plan on this device.','Det erstatter planen på denne enhed.')))return;
    S=Object.assign(blank(),d);migrate();view='plan';commit();}catch(e){alert(L('The share link is invalid or damaged','Delingslinket er ugyldigt eller beskadiget'));}}
function exportJSON(){const n=(S.event||'bordplan').replace(/[^\w\-æøåÆØÅ ]+/g,'').trim().replace(/ +/g,'-')||'bordplan';dl(n+'-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1),'application/json');}
function importJSON(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t);}catch(e){return alert(L('Not a valid plan file','Ikke en gyldig planfil'));}
  if(!d.tables||!d.guests)return alert(L('Not a seating plan file','Ikke en bordplan-fil'));
  const keep=confirm(L(`Open “${d.event||f.name}”.\n\nOK = everything incl. seating\nCancel = tables, guests and rules only`,`Åbn “${d.event||f.name}”.\n\nOK = alt inkl. pladser\nAnnullér = kun borde, gæster og regler`));
  S=Object.assign(blank(),d);if(!keep){S.assign={};S.locked={};}migrate();inp.value='';commit();});}
function exportCSV(){const rows=[[L('Name','Navn'),L('Table','Bord'),L('Seat','Plads')]];seatTable().forEach(x=>rows.push([x.g.name,x.t.name,x.n]));
  dl('bordplan.csv','\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');}

/* ---------- main render ---------- */
function render(){const seats=allSeats();for(const k in S.assign)if(!seats[k])delete S.assign[k];
  renderNav();$('#main').innerHTML={tables:vTables,guests:vGuests,rules:vRules,plan:vPlan,guide:CM?vCGuide:vGuide}[view]();fitAll();}
/* machine API for agents/automation – see agents.md */
window.bordplan={version:2,get:()=>JSON.parse(JSON.stringify(S)),set:d=>{S=Object.assign(blank(),d);migrate();commit();return true;},
  arrange:()=>{const r=arrange();commit();return r.error?r:{ok:true,...window.bordplan.check()};},
  check:()=>{const e=evaluate(S.assign||{},allSeats(),true);return{issues:e.issues,seats:Object.keys(allSeats()).length,guests:S.guests.length};},
  seating:()=>seatTable().map(x=>({guest:x.g.name,table:x.t.name,seat:x.n})),go};
addEventListener('hashchange',()=>{if(/^#d=/.test(location.hash))loadShare();});
document.querySelector('label[for=evName]').textContent=L('Event name','Navn på begivenhed');
(()=>{const e=$('#evName'),f=()=>e.size=Math.max(8,(e.value||e.placeholder).length+1);e.addEventListener('input',f);f();setInterval(f,1000)})();document.querySelector('a.sr').textContent=L('Skip to content','Gå til indhold');migrate();save();render();loadShare();drawFoot();
</script>
